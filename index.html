<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    background: linear-gradient(135deg, #4f46e5, #7c3aed);
    padding: 16px;
  }
  .card {
    width: 100%;
    max-width: 380px;
    background: #fff;
    border-radius: 14px;
    padding: 32px 28px;
    box-shadow: 0 20px 40px rgba(0,0,0,.2);
  }
  h1 { font-size: 1.6rem; margin-bottom: 6px; color: #111827; }
  .sub { color: #6b7280; font-size: .9rem; margin-bottom: 24px; }
  label { display: block; font-size: .85rem; font-weight: 600; color: #374151; margin-bottom: 6px; }
  .field { margin-bottom: 18px; }
  input[type="email"], input[type="password"], input[type="text"] {
    width: 100%;
    padding: 11px 12px;
    border: 1.5px solid #d1d5db;
    border-radius: 8px;
    font-size: 1rem;
    transition: border-color .15s, box-shadow .15s;
  }
  input:focus { outline: none; border-color: #4f46e5; box-shadow: 0 0 0 3px rgba(79,70,229,.2); }
  input.invalid { border-color: #dc2626; }
  .error { color: #dc2626; font-size: .8rem; margin-top: 5px; min-height: 1em; }
  .pw-wrap { position: relative; }
  .toggle {
    position: absolute; right: 10px; top: 50%; transform: translateY(-50%);
    background: none; border: none; color: #4f46e5; font-size: .8rem; font-weight: 600; cursor: pointer;
  }
  .row { display: flex; justify-content: space-between; align-items: center; font-size: .85rem; margin-bottom: 20px; }
  .row a { color: #4f46e5; text-decoration: none; }
  .row a:hover { text-decoration: underline; }
  .remember { display: flex; align-items: center; gap: 6px; color: #374151; }
  button.submit {
    width: 100%; padding: 12px; border: none; border-radius: 8px;
    background: #4f46e5; color: #fff; font-size: 1rem; font-weight: 600; cursor: pointer;
    transition: background .15s;
  }
  button.submit:hover { background: #4338ca; }
  button.submit:disabled { background: #a5b4fc; cursor: not-allowed; }
  .msg { text-align: center; font-size: .9rem; margin-top: 16px; min-height: 1.2em; }
  .msg.ok { color: #059669; }
  .msg.fail { color: #dc2626; }
</style>
</head>
<body>
  <main class="card">
    <h1>Welcome to R.A.P.I.D.</h1>
    <p class="sub">Sign in to your account</p>

    <form id="loginForm" novalidate>
      <div class="field">
        <label for="username">Username</label>
        <input type="text" id="username" placeholder="Enter username" autocomplete="username">
        <div class="error" id="usernameError"></div>
      </div>

      <div class="field">
        <label for="password">Password</label>
        <div class="pw-wrap">
          <input type="password" id="password" placeholder="••••••••" autocomplete="current-password">
          <button type="button" class="toggle" id="toggle">Show</button>
        </div>
        <div class="error" id="passwordError"></div>
      </div>

      <div class="row">
        <label class="remember"><input type="checkbox" id="remember"> Remember me</label>
      </div>

      <button type="submit" class="submit" id="submitBtn">Sign in</button>
      <div class="msg" id="msg"></div>
    </form>

  </main>

<script>
  // The only 4 accounts allowed to log in. Edit these to your own.
  const ACCOUNTS = [
    { username: 'AdminUser1', password: 'password123' },
    { username: 'AdminUser2', password: 'password223' },
    { username: 'AdminUser3', password: 'password334' },
    { username: 'AdminUser4', password: 'password167' }
  ];

  const form = document.getElementById('loginForm');
  const username = document.getElementById('username');
  const password = document.getElementById('password');
  const usernameError = document.getElementById('usernameError');
  const passwordError = document.getElementById('passwordError');
  const msg = document.getElementById('msg');
  const btn = document.getElementById('submitBtn');

  // Show / hide password
  document.getElementById('toggle').addEventListener('click', (e) => {
    const hidden = password.type === 'password';
    password.type = hidden ? 'text' : 'password';
    e.target.textContent = hidden ? 'Hide' : 'Show';
  });

  function validate() {
    let ok = true;
    usernameError.textContent = passwordError.textContent = '';
    username.classList.remove('invalid');
    password.classList.remove('invalid');

    if (!username.value.trim()) {
      usernameError.textContent = 'Please enter your username.';
      username.classList.add('invalid');
      ok = false;
    }
    if (!password.value) {
      passwordError.textContent = 'Please enter your password.';
      password.classList.add('invalid');
      ok = false;
    }
    return ok;
  }

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    msg.textContent = '';
    msg.className = 'msg';
    if (!validate()) return;

    btn.disabled = true;
    btn.textContent = 'Signing in...';

    try {
      const match = ACCOUNTS.find(a =>
        a.username.toLowerCase() === username.value.trim().toLowerCase() &&
        a.password === password.value
      );
      if (!match) throw new Error('Invalid username or password.');
      try {
        sessionStorage.setItem('loggedIn', 'true');
        sessionStorage.setItem('user', match.username);
        sessionStorage.removeItem('loginLogged');
      } catch (e) {}
      window.location.href = 'welcome.html';
    } catch (err) {
      msg.textContent = err.message || 'Something went wrong. Try again.';
      msg.classList.add('fail');
    } finally {
      btn.disabled = false;
      btn.textContent = 'Sign in';
    }
  });
</script>
</body>
</html>
